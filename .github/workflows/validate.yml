name: Validate hero.toml

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.set-examples.outputs.examples }}
    steps:
      - uses: actions/checkout@v4
      - id: set-examples
        run: |
          # Find all directories containing a hero.toml file
          EXAMPLES=$(find features -name "hero.toml" | xargs dirname | jq -R -s -c 'split("\n")[:-1]')
          echo "Found examples: $EXAMPLES"
          echo "examples=$EXAMPLES" >> $GITHUB_OUTPUT

  validate:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.examples) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate ${{ matrix.example }}
        uses: Infra-Heroes/heroctl@main
        with:
          config_path: "${{ matrix.example }}/hero.toml"
