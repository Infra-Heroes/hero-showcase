when:
  # Push pipelines only for main. A branch with a PR already gets the
  # pull_request pipeline; a second pipeline per push doubled the queue,
  # and Renovate PRs waited so long that the clone token expired
  # ("could not read Username").
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  validate:
    image: golang:1.27-alpine
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - apk add --no-cache git build-base
      - printf 'machine codeberg.org\nlogin ci\npassword ' > /root/.netrc
      - printenv CODEBERG_TOKEN >> /root/.netrc
      - printf '\n' >> /root/.netrc
      - chmod 600 /root/.netrc
      - git clone --depth 1 https://codeberg.org/InfraHeroes/heroctl.git /tmp/heroctl
      - (cd /tmp/heroctl && CGO_ENABLED=0 go build -o /usr/local/bin/heroctl ./cmd/heroctl)
      - |
        status=0
        for f in features/*/hero.toml; do
          echo "--- Validating $f ---"
          heroctl validate "$f" || status=1
        done
        exit $status
