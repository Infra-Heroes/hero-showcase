when:
  # Push pipelines only for main. A branch with a PR already gets the
  # pull_request pipeline; a second pipeline per push doubled the queue,
  # and Renovate PRs waited so long that the clone token expired
  # ("could not read Username").
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  validate:
    image: golang:1.27-alpine
    commands:
      - apk add --no-cache curl
      # The newest heroctl release, from the website (Codeberg no longer resolves).
      - TAG=$(curl -fsS https://infra-heroes.de/downloads/heroctl/latest)
      - curl -fsSL -o /usr/local/bin/heroctl "https://infra-heroes.de/downloads/heroctl/$TAG/heroctl-linux-amd64"
      - chmod +x /usr/local/bin/heroctl
      - |
        status=0
        for f in features/*/hero.toml; do
          echo "--- Validating $f ---"
          heroctl validate "$f" || status=1
        done
        exit $status
